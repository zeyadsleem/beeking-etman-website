name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm run test:unit -- --run --project server
      # Replay the full migration chain against a throwaway SQLite file so a
      # duplicate/conflicting migration fails here, seconds after push.
      - run: pnpm exec drizzle-kit migrate
        env:
          DATABASE_URL: file:/tmp/migration-replay.db
      - run: pnpm run build

  e2e:
    runs-on: ubuntu-latest
    needs: test
    env:
      DATABASE_URL: file:./e2e.db
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test

  migrate:
    # Cloudflare Pages (git integration) is the only deployer for the site.
    # This job exists solely to apply D1 schema migrations to production
    # before the new Worker code goes live, and is gated on e2e passing.
    if: github.ref == 'refs/heads/main'
    needs: [test, e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Idempotent: applied migrations are tracked in the remote d1_migrations
      # table and skipped on subsequent runs.
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 migrations apply beeking --remote
